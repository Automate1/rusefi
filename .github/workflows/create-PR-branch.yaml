name: Prepare PR Branch

on:
  workflow_dispatch:

          
jobs:
  copy-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.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 }}
          persist-credentials: false

      - name: Create and Push Copy Branch
        env:
          PAT: ${{ secrets.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 }}
        run: |
          NEW_BRANCH="${{ github.ref_name }}_for_PR"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Remove any existing authorization headers that might be cached
          git config --unset-all http.https://github.com || true
          
          git checkout -b "$NEW_BRANCH"
          
          # Push using the PAT as the "username" in the URL
          git push "https://$PAT@://github.com{{ github.repository }}.git" "$NEW_BRANCH"
