name: Prepare PR Branch

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Select the branch to copy'
        required: true
        type: string
        default: 'main'

jobs:
  copy-branch:
    runs-on: ubuntu-latest
    # permissions:
    #   contents: write
    steps:
      - name: Checkout code
        uses: [actions/checkout@v4](https://github.com)
        with:
          ref: ${{ github.event.inputs.source_branch }}
          fetch-depth: 0

      - name: Create and Push Copy Branch
        run: |
          # Define the new branch name with suffix
          NEW_BRANCH="${{ github.event.inputs.source_branch }}_for_PR"
          
          # Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create and push the new branch
          git checkout -b "$NEW_BRANCH"
          git push origin "$NEW_BRANCH"