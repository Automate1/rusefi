name: Prepare PR Branch

on:
  workflow_dispatch:

jobs:
  copy-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # This automatically checks out the branch you picked in the UI
          ref: ${{ github.ref }}
          fetch-depth: 0
        
      - name: Create and Push Copy Branch
        run: |
          # Uses the name of the branch you selected in the dropdown
          SELECTED_BRANCH="${{ github.ref_name }}"
          NEW_BRANCH="${SELECTED_BRANCH}_for_PR"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout -b "$NEW_BRANCH"
          git push origin "$NEW_BRANCH"