name: Sync upstream to all branches

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # optional

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/rusefi/rusefi.git
          git fetch upstream

      - name: Sync master
        run: |
          git checkout master
          git merge upstream/master --no-edit
          git push origin master

      - name: Sync all other branches
        run: |
          for branch in $(git for-each-ref --format='%(refname:short)' refs/heads/ | grep -v '^master$'); do
            git checkout "$branch"
            git merge upstream/master --no-edit || exit 1
            git push origin "$branch"
          done
