name: Sync upstream into all branches

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # REQUIRED
          ref: master

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/rusefi/rusefi.git || true
          git fetch upstream
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/master into all branches
        run: |
          for branch in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | sed 's|origin/||'); do
            echo "Updating $branch"
            
            # HARD reset working tree to remote branch state
            git reset --hard "origin/$branch"
            git clean -fd

            # Ensure branch points at origin
            git checkout -B "$branch" "origin/$branch"

             # Merge upstream
            git merge upstream/master --no-edit || exit 1

             # Push updated branch
            git push origin "$branch"
  
          done
  