name: Create Single Commit PR Branch
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch with your code'
        required: true
        default: 'dev'

jobs:
  create-pr-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.source_branch }}

      - name: Build PR Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PR_BRANCH_NAME="${{ github.event.inputs.source_branch }}_for_PR"

          # 1. Fetch latest official rusefi
          git remote add upstream https://github.com/rusefi/rusefi
          git fetch upstream master

          # 2. Force the PR branch to be a mirror of upstream/master
          # This ensures the 'gethla' submodule pointer is correct from the start
          git checkout -B "$PR_BRANCH_NAME" upstream/master
          
          # 3. Bring in your files but EXCLUDE the .github folder entirely
          # This prevents your branch's submodule pointers from leaking in
          git checkout ${{ github.event.inputs.source_branch }} -- . ':!.github'

          # 4. CRITICAL: Force the index for the workflows folder to match upstream exactly
          # This specifically unstages any metadata changes to submodules like gethla
          git reset upstream/master -- .github/workflows
          git checkout upstream/master -- .github/workflows
          
          # 5. Commit the result
          # If there are 0 changes to .github/workflows, the push will succeed
          git add -A
          git commit -m "Update from ${{ github.event.inputs.source_branch }} (Single Commit)" || echo "No changes"

          # 6. Final Push
          git push origin "$PR_BRANCH_NAME" --force

      - name: Summary
        run: |
          echo "### ✅ PR Branch Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "Bypassed \`gethla\` error by enforcing 100% metadata parity for \`.github/workflows\`." >> $GITHUB_STEP_SUMMARY