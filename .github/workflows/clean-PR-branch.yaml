name: Create Single Commit PR Branch
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch with your code'
        required: true
        default: 'dev'

jobs:
  create-pr-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.source_branch }}

      - name: Build PR Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PR_BRANCH_NAME="${{ github.event.inputs.source_branch }}_for_PR"

          # 1. Fetch the official rusefi master
          git remote add upstream https://github.com/rusefi/rusefi
          git fetch upstream master

          # 2. Start exactly at rusefi/master (including submodule pointers)
          git checkout -B "$PR_BRANCH_NAME" upstream/master
          
          # 3. Bring in your files but EXCLUDE the .github folder from the disk
          git checkout ${{ github.event.inputs.source_branch }} -- . ':!.github'

          # 4. SELECTIVE STAGING
          # We add all changes BUT explicitly exclude the .github folder
          # This ensures the 'gethla' pointer is never updated in this commit
          git add .
          git reset -- .github/
          git checkout -- .github/

          # 5. Commit the delta
          # If there are 0 changes to .github, the push will succeed
          git commit -m "Update from ${{ github.event.inputs.source_branch }} (Single Commit)" || echo "No changes"

          # 6. Final Push
          git push origin "$PR_BRANCH_NAME" --force

      - name: Summary
        run: |
          echo "### ✅ PR Branch Created" >> $GITHUB_STEP_SUMMARY
          echo "Bypassed \`gethla\` by excluding the \`.github\` directory from the commit." >> $GITHUB_STEP_SUMMARY