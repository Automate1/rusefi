name: Create Single Commit PR Branch
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch with your code'
        required: true
        default: 'dev'

jobs:
  create-pr-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.source_branch }}

      - name: Reset to Latest Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PR_BRANCH_NAME="${{ github.event.inputs.source_branch }}_for_PR"

          # 1. Get the absolute latest from rusefi
          git remote add upstream https://github.com/rusefi/rusefi
          git fetch upstream master

          # 2. Force the new branch to start EXACTLY at the current upstream master
          git checkout -B "$PR_BRANCH_NAME" upstream/master

          # 3. Bring over your code changes from your source branch
          git checkout ${{ github.event.inputs.source_branch }} -- .

          # 4. Strip workflows (to avoid security/cleanliness issues)
          git rm -rf .github/workflows || true

          # 5. Commit as one single 'Delta'
          git add -A
          git commit -m "Update from ${{ github.event.inputs.source_branch }} (Single Commit)"

          # 6. Force push to your fork
          git push origin "$PR_BRANCH_NAME" --force

      - name: Summary
        run: |
          echo "### ✅ PR Branch Updated" >> $GITHUB_STEP_SUMMARY
          echo "Branch \`$PR_BRANCH_NAME\` is now exactly 1 commit ahead of rusefi/master." >> $GITHUB_STEP_SUMMARY