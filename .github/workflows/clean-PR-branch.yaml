name: Create Single Commit PR Branch
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch with your code'
        required: true
        default: 'dev'

jobs:
  create-pr-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.source_branch }}

      - name: Build PR Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PR_BRANCH_NAME="${{ github.event.inputs.source_branch }}_for_PR"

          # 1. Fetch latest official rusefi
          git remote add upstream https://github.com/rusefi/rusefi
          git fetch upstream master

          # 2. Force the PR branch to match official rusefi master exactly
          git checkout -B "$PR_BRANCH_NAME" upstream/master
          
          # 3. USE READ-TREE TO OVERLAY YOUR CODE
          # This command replaces the index with your code but we will 
          # immediately restore the .github path metadata.
          git read-tree -m ${{ github.event.inputs.source_branch }}
          
          # 4. FORCE-RESTORE THE UPSTREAM .GITHUB METADATA
          # This ensures the gethla submodule pointer is BIT-FOR-BIT identical to upstream
          git checkout upstream/master -- .github
          git reset upstream/master -- .github

          # 5. Commit the result
          # If .github matches upstream/master perfectly, there is 0 diff, 
          # and the push will bypass the 'workflows' permission block.
          git commit -m "Update from ${{ github.event.inputs.source_branch }} (Single Commit)" || echo "No changes"

          # 6. Final Push
          git push origin "$PR_BRANCH_NAME" --force

      - name: Summary
        run: |
          echo "### ✅ PR Branch Created" >> $GITHUB_STEP_SUMMARY
          echo "Used \`read-tree\` to preserve upstream workflow metadata." >> $GITHUB_STEP_SUMMARY