name: Create Single Commit PR Branch
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch with your code'
        required: true
        default: 'dev'

jobs:
  create-pr-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.source_branch }}

      - name: Build PR Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PR_BRANCH_NAME="${{ github.event.inputs.source_branch }}_for_PR"

          # 1. Fetch latest from official rusefi
          git remote add upstream https://github.com/rusefi/rusefi
          git fetch upstream master

          # 2. Start fresh from the upstream master state
          git checkout -B "$PR_BRANCH_NAME" upstream/master
          git submodule update --init --recursive

          # 3. Bring in your files from the source branch
          git checkout ${{ github.event.inputs.source_branch }} -- .
          
          # 4. EXPLICITLY CLEAN WORKFLOWS
          # This removes the problematic 'gethla' and all other local changes
          git checkout upstream/master -- .github/workflows
          git clean -fd .github/workflows

          # 5. COMMIT ONLY NON-WORKFLOW FILES
          # We stage everything then explicitly UNSTAGE the workflows folder
          git add .
          git reset HEAD .github/workflows
          
          # Final check: if 'git status' shows anything in .github/workflows, we kill it
          git checkout -- .github/workflows

          git commit -m "Update from ${{ github.event.inputs.source_branch }} (Single Commit)" || echo "No changes"

          # 6. Final Push
          git push origin "$PR_BRANCH_NAME" --force

      - name: Summary
        run: |
          echo "### ✅ Clean PR Branch Created" >> $GITHUB_STEP_SUMMARY
          echo "Bypassed security by enforcing upstream parity on all workflow files." >> $GITHUB_STEP_SUMMARY