name: Create Single Commit PR Branch
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch with your code'
        required: true
        default: 'dev'

jobs:
  create-pr-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.source_branch }}

      - name: Build PR Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PR_BRANCH_NAME="${{ github.event.inputs.source_branch }}_for_PR"

          # 1. Fetch latest official rusefi
          git remote add upstream https://github.com/rusefi/rusefi
          git fetch upstream master

          # 2. Force the PR branch to be a CLONE of upstream/master
          git checkout -B "$PR_BRANCH_NAME" upstream/master
          
          # 3. Use Pathspec Magic to bring over your code BUT lock workflows
          # The ':!.github' tells Git: "Don't even look at this folder"
          git checkout ${{ github.event.inputs.source_branch }} -- . ':!.github'

          # 4. HARD RESET the workflow folder to the exact Upstream Hash
          # This overwrites any local 'Test' branch metadata for gethla
          git reset upstream/master -- .github
          git checkout upstream/master -- .github
          
          # 5. Commit the result
          # If this commit has 0 changes in .github, the push will succeed
          git add -A
          git commit -m "Update from ${{ github.event.inputs.source_branch }} (Single Commit)" || echo "No changes"

          # 6. Final Push
          git push origin "$PR_BRANCH_NAME" --force

      - name: Summary
        run: |
          echo "### ✅ PR Branch Created" >> $GITHUB_STEP_SUMMARY
          echo "Bypassed \`gethla\` error by locking \`.github\` to the official \`rusefi/master\` state." >> $GITHUB_STEP_SUMMARY