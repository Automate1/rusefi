name: Create Single Commit PR Branch
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch with your code'
        required: true
        default: 'dev'

jobs:
  create-pr-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.source_branch }}

      - name: Build PR Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PR_BRANCH_NAME="${{ github.event.inputs.source_branch }}_for_PR"

          # 1. Fetch latest official rusefi
          git remote add upstream https://github.com/rusefi/rusefi
          git fetch upstream master

          # 2. Start fresh from the upstream master state
          git checkout -B "$PR_BRANCH_NAME" upstream/master
          git submodule update --init --recursive

          # 3. Bring in your files from the source branch, but EXCLUDE workflows
          # This prevents the security error while bringing your code
          git checkout ${{ github.event.inputs.source_branch }} -- . ':!.github/workflows'
          
          # 4. RESTORE THE OFFICIAL WORKFLOWS
          # This puts the files back on the disk exactly as they are in rusefi/master.
          # Because they are identical to the base, they won't show as 'deleted' or 'changed'.
          git checkout upstream/master -- .github/workflows

          # 5. Commit the delta
          # This stages everything. Since .github/workflows matches upstream/master,
          # git sees 0 changes for that folder.
          git add -A
          git commit -m "Update from ${{ github.event.inputs.source_branch }} (Single Commit)" || echo "No changes"

          # 6. Final Push to your fork
          git push origin "$PR_BRANCH_NAME" --force

      - name: Summary
        run: |
          echo "### ✅ PR Branch Created" >> $GITHUB_STEP_SUMMARY
          echo "Branch \`$PR_BRANCH_NAME\` is now ready." >> $GITHUB_STEP_SUMMARY
          echo "Workflows are synced with \`rusefi/master\` to prevent 'deleted' status in PR." >> $GITHUB_STEP_SUMMARY