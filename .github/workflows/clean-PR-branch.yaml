name: Create Single Commit PR Branch
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch with your code'
        required: true
        default: 'dev'

jobs:
  create-pr-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all history and submodules recursively
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.source_branch }}

      - name: Build PR Branch Relative to Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PR_BRANCH_NAME="${{ github.event.inputs.source_branch }}_for_PR"

          # 1. Fetch the latest from official rusefi
          git remote add upstream https://github.com/rusefi/rusefi
          git fetch upstream master

          # 2. Create the PR branch based on the latest official master
          git checkout -B "$PR_BRANCH_NAME" upstream/master

          # 3. Sync submodules to the official upstream state
          git submodule update --init --recursive

          # 4. Overwrite files with your code changes only (excluding workflows)
          # The -- . flag copies files without dragging the old commit history
          git checkout ${{ github.event.inputs.source_branch }} -- .

          # 5. Clean up workflows to avoid security errors and PR clutter
          git rm -rf .github/workflows || true

          # 6. Commit as a single delta
          # This commit will only show changes relative to rusefi/master
          git add -A
          git commit -m "Update from ${{ github.event.inputs.source_branch }} (Single Commit)"

          # 7. Force push the PR branch to your fork
          git push origin "$PR_BRANCH_NAME" --force

      - name: Summary
        run: |
          echo "### ✅ PR Branch Created with Submodules" >> $GITHUB_STEP_SUMMARY
          echo "Branch \`$PR_BRANCH_NAME\` is ready for PR to \`rusefi/master\`." >> $GITHUB_STEP_SUMMARY
          echo "Submodules were synced to match the upstream state." >> $GITHUB_STEP_SUMMARY