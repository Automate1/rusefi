name: Create Single Commit PR Branch
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch with your code'
        required: true
        default: 'dev'

jobs:
  create-pr-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.source_branch }}

      - name: Build PR Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PR_BRANCH_NAME="${{ github.event.inputs.source_branch }}_for_PR"

          # 1. Fetch latest official rusefi
          git remote add upstream https://github.com/rusefi/rusefi
          git fetch upstream master

          # 2. Start from official master
          git checkout -B "$PR_BRANCH_NAME" upstream/master
          git submodule update --init --recursive

          # 3. Carefully bring over your changes
          # We use 'git checkout' for the whole repo BUT immediately 
          # restore the upstream workflows so they aren't marked as changed/deleted
          git checkout ${{ github.event.inputs.source_branch }} -- .
          
          # 4. RESTORE the original upstream workflows
          # This tells Git: "Use the files from rusefi/master for this folder"
          # This prevents them from showing up as deleted or modified in the PR.
          git checkout upstream/master -- .github/workflows

          # 5. Commit the delta
          git add -A
          git commit -m "Update from ${{ github.event.inputs.source_branch }} (Single Commit)"

          # 6. Force push
          git push origin "$PR_BRANCH_NAME" --force

      - name: Summary
        run: |
          echo "### ✅ Clean PR Branch Created" >> $GITHUB_STEP_SUMMARY
          echo "The PR will no longer show workflow deletions." >> $GITHUB_STEP_SUMMARY