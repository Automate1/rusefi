name: Create Single Commit PR Branch
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch with your code'
        required: true
        default: 'dev'

jobs:
  create-pr-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.source_branch }}

      - name: Build PR Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PR_BRANCH_NAME="${{ github.event.inputs.source_branch }}_for_PR"

          # 1. Fetch latest official rusefi
          git remote add upstream https://github.com/rusefi/rusefi
          git fetch upstream master

          # 2. Start from official rusefi master
          git checkout -B "$PR_BRANCH_NAME" upstream/master
          
          # 3. Bring in your files but EXCLUDE the .github folder from the disk
          # This prevents the 'gethla' metadata from entering the branch
          git checkout ${{ github.event.inputs.source_branch }} -- . ':!.github'

          # 4. EXPLICITLY UNSTAGE THE WORKFLOW FOLDER
          # This ensures the 'gethla' pointer is exactly what is in upstream/master
          git reset HEAD .github/
          git checkout -- .github/

          # 5. COMMIT EVERYTHING EXCEPT WORKFLOWS
          # The ':!.github' flag ensures the commit object has zero delta for workflows
          git add . ':!.github'
          git commit -m "Update from ${{ github.event.inputs.source_branch }} (Single Commit)" || echo "No changes"

          # 6. Final Push to your fork
          git push origin "$PR_BRANCH_NAME" --force

      - name: Summary
        run: |
          echo "### ✅ PR Branch Created" >> $GITHUB_STEP_SUMMARY
          echo "Bypassed \`gethla\` by enforcing a Zero-Delta commit for the \`.github\` directory." >> $GITHUB_STEP_SUMMARY