name: Create Single Commit PR Branch
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch with your code'
        required: true
        default: 'dev'

jobs:
  create-pr-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.source_branch }}

      - name: Build PR Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PR_BRANCH_NAME="${{ github.event.inputs.source_branch }}_for_PR"

          # 1. Fetch latest official rusefi
          git remote add upstream https://github.com/rusefi/rusefi
          git fetch upstream master

          # 2. Force the PR branch to be a 1:1 mirror of upstream/master
          git checkout -B "$PR_BRANCH_NAME" upstream/master
          git submodule update --init --recursive
          
          # 3. THE MAGIC FIX: Tell Git to ignore ANY changes to the .github directory
          # This "locks" the workflows and the gethla submodule pointer
          git ls-files -z .github | xargs -0 git update-index --assume-unchanged
          # Also specifically lock the submodule pointer itself
          git update-index --assume-unchanged .github/workflows/hw-ci/gethla

          # 4. Bring in your files from the source branch
          # We use the pathspec exclusion as a second layer of defense
          git checkout ${{ github.event.inputs.source_branch }} -- . ':!.github'

          # 5. Commit the result
          # Git will only "see" changes in your code, not in the .github folder
          git add -A
          git commit -m "Update from ${{ github.event.inputs.source_branch }} (Single Commit)" || echo "No changes"

          # 6. Final Push
          git push origin "$PR_BRANCH_NAME" --force