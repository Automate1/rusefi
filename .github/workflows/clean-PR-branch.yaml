name: Create Single Commit PR Branch
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch with your code'
        required: true
        default: 'dev'

jobs:
  create-pr-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.source_branch }}

      - name: Build PR Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PR_BRANCH_NAME="${{ github.event.inputs.source_branch }}_for_PR"

          # 1. Fetch latest official rusefi
          git remote add upstream https://github.com/rusefi/rusefi
          git fetch upstream master

          # 2. Start from official upstream/master
          git checkout -B "$PR_BRANCH_NAME" upstream/master
          git submodule update --init --recursive

          # 3. FORCE GIT TO IGNORE THE WORKFLOWS DIRECTORY
          # We add it to the local exclude file so 'git add' can't see it
          echo ".github/workflows" >> .git/info/exclude
          
          # 4. Bring in your files from the source branch
          # Using the exclusion pathspec again for double-safety
          git checkout ${{ github.event.inputs.source_branch }} -- . ':!.github/workflows'

          # 5. Commit only the non-workflow changes
          # We stage everything; git will ignore .github/workflows because of step 3
          git add .
          git commit -m "Update from ${{ github.event.inputs.source_branch }} (Single Commit)" || echo "No changes"

          # 6. Force push
          git push origin "$PR_BRANCH_NAME" --force

      - name: Summary
        run: |
          echo "### ✅ PR Branch Created" >> $GITHUB_STEP_SUMMARY
          echo "Excluded \`.github/workflows\` and the \`gethla\` gitlink to bypass security blocks." >> $GITHUB_STEP_SUMMARY
