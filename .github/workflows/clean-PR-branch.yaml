name: Create Single Commit PR Branch
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch with your code'
        required: true
        default: 'dev'

jobs:
  create-pr-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: [actions/checkout@v4](https://github.com)
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.source_branch }}

      - name: Build PR Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PR_BRANCH_NAME="${{ github.event.inputs.source_branch }}_for_PR"

          # 1. Fetch latest from official rusefi
          git remote add upstream https://github.com/rusefi/rusefi
          git fetch upstream master

          # 2. Start fresh from the upstream master state
          git checkout -B "$PR_BRANCH_NAME" upstream/master
          git submodule update --init --recursive

          # 3. Bring in your files from the source branch
          git checkout ${{ github.event.inputs.source_branch }} -- .
          
          # 4. RESET THE WORKFLOWS FOLDER to match upstream exactly
          git checkout upstream/master -- .github/workflows
          
          # 5. COMMIT EVERYTHING EXCEPT WORKFLOWS
          # The ':!.github/workflows' tells git to ignore that specific path
          git add .
          git reset .github/workflows
          git commit -m "Update from ${{ github.event.inputs.source_branch }} (Single Commit)" || echo "No changes to commit"

          # 6. Final Push
          git push origin "$PR_BRANCH_NAME" --force

      - name: Summary
        run: |
          echo "### ✅ Clean PR Branch Created" >> $GITHUB_STEP_SUMMARY
          echo "Changes to \`.github/workflows\` were ignored to satisfy securit