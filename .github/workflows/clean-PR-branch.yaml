name: Create Single Commit PR Branch
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch with your code (on Automate1/rusefi)'
        required: true
        default: 'dev'

jobs:
  create-pr-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.source_branch }}

      - name: Build PR Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PR_BRANCH_NAME="${{ github.event.inputs.source_branch }}_for_PR"

          # 1. Fetch latest official rusefi (the comparison target)
          git remote add upstream https://github.com/rusefi/rusefi
          git fetch upstream master

          # 2. Create the PR branch based on the official rusefi master
          git checkout -B "$PR_BRANCH_NAME" upstream/master
          
          # 3. Physically wipe the local workflows folder
          # This prevents any 'gethla' metadata from leaking into the staging area
          rm -rf .github/workflows

          # 4. Pull in your code changes but IGNORE the workflows path
          git checkout ${{ github.event.inputs.source_branch }} -- . ':!.github/workflows'

          # 5. RE-STAGING SAFETY:
          # Force the index to match the upstream/master exactly for workflows
          git reset upstream/master -- .github/workflows
          
          # 6. Final commit (contains 0 changes to workflows)
          git add -A
          git commit -m "Update from ${{ github.event.inputs.source_branch }} (Single Commit)" || echo "No changes"

          # 7. Push to YOUR fork (Automate1/rusefi)
          # This uses the default 'origin' which is your fork
          git push origin "$PR_BRANCH_NAME" --force

      - name: Summary
        run: |
          echo "### ✅ PR Branch Created on Your Fork" >> $GITHUB_STEP_SUMMARY
          echo "Target: \`Automate1/rusefi/$PR_BRANCH_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "Comparison Base: \`rusefi/rusefi/master\`" >> $GITHUB_STEP_SUMMARY