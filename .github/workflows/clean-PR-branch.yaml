name: Create Single Commit PR Branch
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch with your code'
        required: true
        default: 'dev'

jobs:
  create-pr-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.source_branch }}

      - name: Build PR Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PR_BRANCH_NAME="${{ github.event.inputs.source_branch }}_for_PR"

          # 1. Fetch latest official rusefi
          git remote add upstream https://github.com/rusefi/rusefi
          git fetch upstream master

          # 2. Start from official master
          git checkout -B "$PR_BRANCH_NAME" upstream/master
          git submodule update --init --recursive

          # 3. Bring over your code changes
          git checkout ${{ github.event.inputs.source_branch }} -- .
          
          # 4. RESET THE WORKFLOWS FOLDER ENTIRELY
          # This deletes any new workflows you added and restores official ones.
          # This ensures zero changes to .github/workflows in the final PR.
          git checkout upstream/master -- .github/workflows
          
          # 5. Force-remove any stray workflow files that might be staged
          git rm -rf --cached .github/workflows || true

          # 6. Commit and Push
          # Now there are 0 changes to workflows, so the security error is bypassed.
          git add -A
          git commit -m "Update from ${{ github.event.inputs.source_branch }} (Single Commit)"
          git push origin "$PR_BRANCH_NAME" --force

      - name: Summary
        run: |
          echo "### ✅ Clean PR Branch Created" >> $GITHUB_STEP_SUMMARY
          echo "All new or modified workflows were excluded to allow the push." >> $GITHUB_STEP_SUMMARY