name: Reset Branch History (With Backup)
on:
  workflow_dispatch:

jobs:
  clear-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Create Backup and Reset History
        run: |
          # 1. Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Create a timestamped backup branch
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP_NAME="backup/${{ github.ref_name }}-$TIMESTAMP"
          echo "Creating backup branch: $BACKUP_NAME"
          git checkout -b "$BACKUP_NAME"
          git push origin "$BACKUP_NAME"

          # 3. Switch back to the branch we want to clean
          git checkout ${{ github.ref_name }}

          # 4. Perform the history wipe
          # This keeps all current files but removes the commit history
          git checkout --orphan temp_branch
          git add -A
          git commit -m "Initial commit (Cleaned history at $TIMESTAMP)"
          
          # 5. Overwrite the target branch with the clean version
          git branch -D ${{ github.ref_name }}
          git branch -m ${{ github.ref_name }}
          
          # 6. Force push the clean history
          git push origin ${{ github.ref_name }} --force

      - name: Success Summary
        run: |
          echo "### ✅ History Reset Successful" >> $GITHUB_STEP_SUMMARY
          echo "The branch \`${{ github.ref_name }}\` has been reset to a single commit." >> $GITHUB_STEP_SUMMARY
          echo "A backup of the old history was created at: \`backup/${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
