name: Reset Branch History
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Type the EXACT name of the branch to wipe'
        required: true
        default: 'dev'

jobs:
  clear-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # We checkout the branch the user typed in the box
          ref: ${{ github.event.inputs.target_branch }}

      - name: Backup and Squash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Create a safety backup of the branch before wiping
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP_NAME="backup/${{ github.event.inputs.target_branch }}-$TIMESTAMP"
          git checkout -b "$BACKUP_NAME"
          git push origin "$BACKUP_NAME"

          # 2. Return to the branch we want to clean
          git checkout ${{ github.event.inputs.target_branch }}

          # 3. Soft reset to the very first commit (preserves files, wipes history)
          # Using rev-list --max-parents=0 finds the 'root' commit
          git reset --soft $(git rev-list --max-parents=0 HEAD)
          
          # 4. Commit everything as a single new "Initial" state
          git add -A
          git commit -m "Cleaned history (Squashed at $TIMESTAMP)"
          
          # 5. Force push to overwrite the remote history
          git push origin ${{ github.event.inputs.target_branch }} --force

      - name: Summary
        run: |
          echo "### ✅ History Reset Complete" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.event.inputs.target_branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Backup created: \`backup/${{ github.event.inputs.target_branch }}\`" >> $GITHUB_STEP_SUMMARY