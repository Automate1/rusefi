name: Reset Branch History
on:
  workflow_dispatch:

jobs:
  clear-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Squash History into Single Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Create a new temporary branch from the current state
          git checkout -b temp-squash-branch

          # 2. Reset the branch to the very first commit ever made in the repo
          # This keeps all your files 'staged' for a new commit
          git reset $(git rev-list --max-parents=0 HEAD)

          # 3. Commit everything as one single 'clean' commit
          git add -A
          git commit -m "Cleaned history - squashed all commits"

          # 4. Force push this back to your selected branch
          git push origin temp-squash-branch:${{ github.ref_name }} --force
