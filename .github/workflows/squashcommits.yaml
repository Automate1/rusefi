name: Reset Branch History
on:
  workflow_dispatch: # No inputs here = GitHub shows the branch selector automatically

jobs:
  clear-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Backup and Reset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Create a safety backup branch
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          git checkout -b "backup/${{ github.ref_name }}-$TIMESTAMP"
          git push origin "backup/${{ github.ref_name }}-$TIMESTAMP"
          
          # 2. Go back to the branch we want to wipe
          git checkout ${{ github.ref_name }}

          # 3. Squash all changes into a single commit
          # We reset to the very first commit to keep file history links
          git reset $(git rev-list --max-parents=0 HEAD)
          
          # 4. Commit the current state as one single block
          git add -A
          git commit -m "Cleaned history (Squashed to single commit)"
          
          # 5. Force push to overwrite the old messy history
          git push origin ${{ github.ref_name }} --force
