name: Squash Branch Commits

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'The name of the branch to squash (e.g., feature-branch)'
        required: true
        type: string

jobs:
  squash_commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: [actions/checkout](https://github.com)
        with:
          fetch-depth: 0 # Fetch all history to ensure accuracy

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Squash commits and force push
        run: |
          BRANCH_NAME="${{ github.event.inputs.branch_name }}"
          
          # Check out the target branch
          git checkout $BRANCH_NAME

          # Create a temporary orphan branch from the current state (no history)
          git checkout --orphan temp_branch

          # Stage all changes (including deletions)
          git add -A

          # Commit all changes as a single "Initial commit" for the new history
          git commit -m "Clean commit of all changes"

          # Delete the original branch locally
          git branch -D $BRANCH_NAME

          # Rename the temporary branch to the original branch name
          git branch -m $BRANCH_NAME

          # Force push to overwrite the remote branch's history
          git push origin $BRANCH_NAME --force