name: Reset Branch History
on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'The branch you want to clear'
        required: true
        default: 'main'

jobs:
  clear-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch_name }}

      - name: Rebuild Branch with Single Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create a new orphan branch containing the current files
          git checkout --orphan temp_branch
          
          # Stage all files and create the first commit
          git add -A
          git commit -m "Initial commit (history cleared)"
          
          # Force rename the temp branch to the target branch name
          git branch -D ${{ github.event.inputs.branch_name }}
          git branch -m ${{ github.event.inputs.branch_name }}
          
          # Force push to overwrite the remote history
          git push origin ${{ github.event.inputs.branch_name }} --force
